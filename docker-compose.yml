# Glukorádce na vlastním serveru (Oracle Cloud Always Free, Hetzner, Raspberry Pi…)
# Spuštění: docker compose up -d --build   (nebo deploy/install.sh, který udělá vše)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GLUKORADCE_DB: /data/glukoradce.sqlite
      GLUKORADCE_AUTORELOAD: "0"
      GLUKORADCE_HTTPS: "1"
      PORT: "8765"
      TZ: "Europe/Prague"
      TIMEZONE_NAME: "Europe/Prague"
    volumes:
      - data:/data
      - tconnect_cache:/root/.config/tconnectsync   # uložený přihlašovací token Tandemu (přežije aktualizace)
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  tconnect_cache:
  caddy_data:
  caddy_config:
